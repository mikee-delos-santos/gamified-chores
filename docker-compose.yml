# Local services for gamified-chores development + tests.
# Postgres for the Rails backend. Start with:  docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chore
      POSTGRES_PASSWORD: chore
      POSTGRES_DB: chore_development
    # Host port 5433 avoids clashing with a local Postgres on 5432.
    # Containers still reach it as db:5432 over the compose network.
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chore"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
